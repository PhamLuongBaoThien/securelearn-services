# ========================
# Kong Declarative Configuration
# API Gateway cho SecureLearn Microservices
# ========================
_format_version: "3.0"

# =============================================
# CONSUMERS — Ứng dụng được phép sử dụng JWT
# =============================================
# Consumer = "Ai được phép gửi JWT?"
# Khi Kong nhận JWT, nó đọc claim 'iss' → tìm consumer có 'key' trùng khớp
# → dùng 'secret' của consumer đó để verify token
consumers:
  - username: securelearn-app
    jwt_secrets:
      - key: "securelearn"
        secret: "securelearn_access_token_secret"   # PHẢI GIỐNG ACCESS_TOKEN trong .env
        algorithm: HS256

# =============================================
# SERVICES & ROUTES
# =============================================
services:
  # ----- Identity Service -----
  - name: identity-service
    url: http://identity-service:5001    # Tên service trong Docker network
    routes:
      # Routes PUBLIC — Không cần JWT (đăng nhập, đăng ký, OAuth...)
      - name: identity-public
        paths:
          - /api/auth/login
          - /api/auth/register
          - /api/auth/logout
          - /api/auth/refresh-token
          - /api/auth/forgot-password
          - /api/auth/verify-reset-otp
          - /api/auth/reset-password
          - /api/auth/google
        strip_path: false

      # Routes PROTECTED CORS PREFLIGHT — Không cần JWT
      - name: identity-preflight
        paths:
          - /api/auth/me
          - /api/auth/profile
          - /api/auth/profile/role
          - /api/auth/account
          - /api/auth/password
        strip_path: false
        methods:
          - OPTIONS

      # Routes PROTECTED — Cần JWT
      - name: identity-protected
        paths:
          - /api/auth/me
          - /api/auth/profile
          - /api/auth/profile/role
          - /api/auth/account
          - /api/auth/password
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE

      # Admin routes PUBLIC — Không cần JWT
      - name: identity-admin-public
        paths:
          - /api/admin/auth
        strip_path: false
        methods:
          - POST

      # Admin routes PROTECTED CORS PREFLIGHT — Không cần JWT
      - name: identity-admin-preflight
        paths:
          - /api/admin/auth/me
          - /api/admin/auth/profile
          - /api/admin/auth/password
        strip_path: false
        methods:
          - OPTIONS

      # Admin routes PROTECTED — Cần JWT
      - name: identity-admin-protected
        paths:
          - /api/admin/auth/me
          - /api/admin/auth/profile
          - /api/admin/auth/password
        strip_path: false
        methods:
          - GET
          - PUT

  # ----- Course Service -----
  - name: course-service
    url: http://course-service:5002      # Tên service trong Docker network
    routes:
      # Routes CORS PREFLIGHT — Không cần JWT
      # Cho phép browser gửi OPTIONS request mà không bị JWT chặn
      - name: course-preflight
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - OPTIONS

      # Routes PROTECTED GET — Cần JWT (enrolled, my-courses, manage)
      # Kong match longest path trước → /api/courses/enrolled khớp trước /api/courses
      - name: course-protected-reads
        paths:
          - /api/courses/enrolled
          - /api/courses/my-courses
          - ~/api/courses/[^/]+/manage$
          - /api/categories/admin/all
        strip_path: false
        methods:
          - GET

      # Routes PUBLIC — Không cần JWT
      # GET /api/courses (danh sách) và GET /api/courses/:slug (chi tiết)
      - name: course-public
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - GET

      # Routes PROTECTED — Cần JWT
      # POST, PUT, PATCH, DELETE /api/courses/...
      - name: course-protected
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE

  # --- Media Service (sẽ triển khai sau) ---
  # - name: media-service
  #   url: http://media-service:5003
  #   routes:
  #     - name: media-routes
  #       paths:
  #         - /api/media
  #       strip_path: false

# =============================================
# PLUGINS
# =============================================
plugins:
  # ----- GLOBAL: CORS -----
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization 
        - Content-Type
      credentials: true
      max_age: 3600

  # ----- GLOBAL: Rate Limiting -----
  - name: rate-limiting
    config:
      minute: 100 
      policy: local

  # ----- JWT cho Identity Protected Routes -----
  # Chỉ áp dụng cho route "identity-protected" (me, profile, account, password)
  - name: jwt
    route: identity-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  # ----- JWT cho Course Protected Routes -----
  # Áp dụng cho route "course-protected" (POST, PUT, PATCH, DELETE)
  - name: jwt
    route: course-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  # ----- JWT cho Course Protected GET Routes -----
  # Áp dụng cho route "course-protected-reads" (GET /enrolled, /my-courses)
  - name: jwt
    route: course-protected-reads
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  # ----- JWT cho Admin Protected Routes -----
  - name: jwt
    route: identity-admin-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
