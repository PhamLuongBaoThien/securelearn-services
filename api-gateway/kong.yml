# ========================
# Kong Declarative Configuration
# API Gateway cho SecureLearn Microservices
#
# Route matrix hiện tại cho luồng tạo khóa học:
# - PUBLIC:
#   GET /api/courses
#   GET /api/courses/:slug
#   GET /api/categories
# - PROTECTED (JWT qua Kong, role check ở service):
#   GET /api/courses/enrolled
#   GET /api/courses/my-courses
#   GET /api/courses/:id/manage
#   GET /api/courses/:courseId/lessons/:lessonId/quiz
#   GET /api/courses/:courseId/lessons/:lessonId/quiz/play
#   POST /api/courses/:id/enroll
#   POST/PUT/PATCH/DELETE /api/courses/...
#   GET /api/categories/admin/all
#   POST/PUT/PATCH/DELETE /api/categories/...
#   GET/POST /api/media/videos...
#   GET/POST /api/media/documents...
# ========================
_format_version: "3.0"

consumers:
  - username: securelearn-app
    jwt_secrets:
      - key: "securelearn"
        secret: "securelearn_access_token_secret"
        algorithm: HS256

services:
  - name: identity-service
    url: http://identity-service:5001
    routes:
      - name: identity-public
        paths:
          - /api/auth/login
          - /api/auth/register
          - /api/auth/logout
          - /api/auth/refresh-token
          - /api/auth/forgot-password
          - /api/auth/verify-reset-otp
          - /api/auth/reset-password
          - /api/auth/google
        strip_path: false

      - name: identity-preflight
        paths:
          - /api/auth/me
          - /api/auth/profile
          - /api/auth/profile/role
          - /api/auth/account
          - /api/auth/password
        strip_path: false
        methods:
          - OPTIONS

      - name: identity-protected
        paths:
          - /api/auth/me
          - /api/auth/profile
          - /api/auth/profile/role
          - /api/auth/account
          - /api/auth/password
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE

      - name: identity-admin-public
        paths:
          - /api/admin/auth
        strip_path: false
        methods:
          - POST

      - name: identity-admin-preflight
        paths:
          - /api/admin/auth/me
          - /api/admin/auth/profile
          - /api/admin/auth/password
          - ~/api/admin/auth/staff
          - ~/api/admin/auth/roles
          - ~/api/admin/auth/users
        strip_path: false
        methods:
          - OPTIONS

      - name: identity-admin-protected
        paths:
          - /api/admin/auth/me
          - /api/admin/auth/profile
          - /api/admin/auth/password
          - ~/api/admin/auth/staff
          - ~/api/admin/auth/roles
          - ~/api/admin/auth/users
        strip_path: false
        methods:
          - GET
          - PUT
          - POST
          - DELETE
          - PATCH

  - name: course-service
    url: http://course-service:5002
    routes:
      - name: course-preflight
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - OPTIONS

      - name: course-protected-reads
        paths:
          - /api/courses/enrolled
          - /api/courses/my-courses
          - /api/categories/admin/all
          - ~/api/courses/[^/]+/manage$
          - ~/api/courses/[^/]+/lessons/[^/]+/quiz$
          - ~/api/courses/[^/]+/lessons/[^/]+/quiz/play$
        regex_priority: 200
        strip_path: false
        methods:
          - GET

      - name: course-public
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - GET

      - name: course-protected
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE

  - name: media-service
    url: http://media-service:5003
    routes:
      - name: media-preflight
        paths:
          - /api/media/videos
          - /api/media/documents
        strip_path: false
        methods:
          - OPTIONS

      - name: media-protected
        paths:
          - /api/media/videos
          - /api/media/documents
        strip_path: false
        methods:
          - GET
          - POST

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 100
      policy: local

  - name: jwt
    route: identity-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: course-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: course-protected-reads
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: media-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: identity-admin-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
