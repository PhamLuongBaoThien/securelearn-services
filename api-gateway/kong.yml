# ========================
# Kong Declarative Configuration
# API Gateway cho SecureLearn Microservices
#
# Route matrix hiện tại cho luồng tạo khóa học:
# - PUBLIC:
#   GET /api/courses
#   GET /api/courses/:slug
#   GET /api/categories
#   GET/POST/DELETE /api/cart...
# - PROTECTED (JWT qua Kong, role check ở service):
#   GET /api/courses/enrolled
#   GET /api/courses/my-courses
#   GET /api/courses/:id/manage
#   GET /api/courses/:courseId/lessons/:lessonId/quiz
#   GET /api/courses/:courseId/lessons/:lessonId/quiz/play
#   POST /api/courses/:id/enroll
#   POST/PUT/PATCH/DELETE /api/courses/...
#   GET /api/categories/admin/all
#   POST/PUT/PATCH/DELETE /api/categories/...
#   GET/POST /api/media/videos...
#   GET/POST /api/media/documents...
# ========================
_format_version: "3.0"

consumers:
  - username: securelearn-app
    jwt_secrets:
      - key: "securelearn"
        secret: "securelearn_access_token_secret"
        algorithm: HS256

services:
  - name: identity-service
    url: http://identity-service:5001
    routes:
      - name: identity-public
        paths:
          - /api/auth/login
          - /api/auth/register
          - /api/auth/logout
          - /api/auth/refresh-token
          - /api/auth/forgot-password
          - /api/auth/verify-reset-otp
          - /api/auth/reset-password
          - /api/auth/google
        strip_path: false

      - name: identity-preflight
        paths:
          - /api/auth/me
          - /api/auth/profile
          - /api/auth/profile/role
          - /api/auth/account
          - /api/auth/password
        strip_path: false
        methods:
          - OPTIONS

      - name: identity-protected
        paths:
          - /api/auth/me
          - /api/auth/profile
          - /api/auth/profile/role
          - /api/auth/account
          - /api/auth/password
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE

      - name: identity-admin-public
        paths:
          - /api/admin/auth
        strip_path: false
        methods:
          - POST

      - name: identity-admin-preflight
        paths:
          - /api/admin/auth/me
          - /api/admin/auth/profile
          - /api/admin/auth/password
          - ~/api/admin/auth/staff
          - ~/api/admin/auth/roles
          - ~/api/admin/auth/users
        strip_path: false
        methods:
          - OPTIONS

      - name: identity-admin-protected
        paths:
          - /api/admin/auth/me
          - /api/admin/auth/profile
          - /api/admin/auth/password
          - ~/api/admin/auth/staff
          - ~/api/admin/auth/roles
          - ~/api/admin/auth/users
        strip_path: false
        methods:
          - GET
          - PUT
          - POST
          - DELETE
          - PATCH

  - name: course-service
    url: http://course-service:5002
    routes:
      - name: course-preflight
        paths:
          - /api/courses
          - /api/categories
          - /api/admin/courses
        strip_path: false
        methods:
          - OPTIONS

      - name: course-protected-reads
        paths:
          - /api/courses/enrolled
          - /api/courses/my-courses
          - /api/categories/admin/all
          - ~/api/courses/[^/]+/manage$
          - ~/api/courses/[^/]+/lessons/[^/]+/quiz$
          - ~/api/courses/[^/]+/lessons/[^/]+/quiz/play$
        regex_priority: 200
        strip_path: false
        methods:
          - GET

      - name: course-public
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - GET

      - name: course-protected
        paths:
          - /api/courses
          - /api/categories
        strip_path: false
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE

      - name: course-admin-protected
        paths:
          - /api/admin/courses
        strip_path: false
        methods:
          - GET
          - PATCH

      - name: cart-preflight # CORS preflight là OPTIONS request, không có header Authorization → để route riêng không gắn JWT plugin.
        paths:
          - /api/cart
        strip_path: false
        methods:
          - OPTIONS

      - name: cart-protected
        paths:
          - /api/cart
        strip_path: false
        methods:
          - GET
          - POST
          - DELETE

  - name: payment-service
    url: http://payment-service:5004
    routes:
      - name: payment-preflight
        paths:
          - /api/payments
        strip_path: false
        methods:
          - OPTIONS

      - name: payment-webhook
        paths:
          - /api/payments/webhooks
        strip_path: false
        methods:
          - GET
          - POST

      - name: payment-momo-browser-return
        paths:
          - /api/payments/momo-browser-return
        strip_path: false
        methods:
          - GET

      - name: payment-protected
        paths:
          - /api/payments
        strip_path: false
        methods:
          - GET
          - POST
          - PUT

  - name: media-service
    url: http://media-service:5003
    routes:
      - name: media-preflight
        paths:
          - /api/media/videos
          - /api/media/documents
        strip_path: false
        methods:
          - OPTIONS

      # Route riêng cho các API upload — áp rate limit chặt hơn route thông thường.
      # Lý do: API này sinh presigned URLs (cho phép PUT file lên storage),
      # nếu bị spam có thể tạo hàng nghìn URL → chiếm bandwidth MinIO.
      # Tách ra để gắn rate-limiting riêng: 10 req/phút (thay vì 100 req/phút toàn cục).
      - name: media-upload
        paths:
          - /api/media/videos/initiate-upload
          - ~/api/media/videos/[^/]+/batch-part-urls
          # Confirm/abort cũng thuộc upload surface:
          # confirm ghép multipart và trigger processing, abort hủy asset/session.
          # Đưa chung vào route này để cùng chịu JWT + rate limit theo tài khoản.
          - ~/api/media/videos/[^/]+/confirm-upload
          - ~/api/media/videos/[^/]+/abort-upload
        regex_priority: 300
        strip_path: false
        methods:
          - GET
          - POST

      - name: media-protected
        paths:
          - /api/media/videos
          - /api/media/documents
        strip_path: false
        methods:
          - GET
          - POST

  # ===== MINIO STORAGE PROXY =====
  # FE upload video qua presigned URL sẽ đi qua Kong thay vì gọi trực tiếp MinIO.
  # Mục đích: GIẤU MinIO endpoint thật (minio:9000) khỏi client.
  #
  # ⚠️ QUAN TRỌNG — Tại sao dùng /securelearn-media thay vì /storage?
  # Presigned URL S3v4 ký cả host + path vào chữ ký (X-Amz-Signature).
  # Nếu dùng /storage rồi strip_path → path thay đổi → signature mismatch → MinIO reject 403.
  # Dùng /securelearn-media (chính là tên bucket) + strip_path: false → Kong forward nguyên path
  # → MinIO nhận đúng path đã ký → signature khớp → OK.
  #
  # preserve_host: true → Kong giữ nguyên Host header (localhost:8000) khi forward về MinIO.
  # S3 signature bao gồm Host header — nếu Kong đổi thành minio:9000 → signature sai.
  #
  # Route này KHÔNG gắn JWT plugin vì:
  # - Presigned URL đã chứa chữ ký S3 (X-Amz-Signature) bên trong query string.
  # - Browser PUT chunk không gửi header Authorization → nếu bật JWT sẽ bị reject.
  - name: minio-storage
    url: http://minio:9000
    routes:
      - name: minio-proxy
        paths:
          - /securelearn-media
        preserve_host: true
        strip_path: false
        methods:
          - PUT
          - GET
          - HEAD
          - OPTIONS

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      # exposed_headers cho phép browser JS đọc các header này từ response.
      # FE cần đọc ETag sau mỗi PUT chunk để gửi về backend khi confirm upload.
      # Nếu không expose, xhr.getResponseHeader('etag') trả về null → upload fail.
      exposed_headers:
        - ETag
        - etag
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 100
      policy: local

  # Rate limiting RIÊNG cho route upload — chặt hơn rate limit toàn cục.
  # Tối đa 10 lần gọi initiate-upload hoặc batch-part-urls mỗi phút CHO MỖI TÀI KHOẢN (Đếm theo Header Authorization).
  # Instructor thông thường chỉ upload 1-2 video/phút, nên 10 là dư giả.
  # Nếu vượt → Kong trả HTTP 429 Too Many Requests.
  - name: rate-limiting
    route: media-upload
    config:
      minute: 10
      limit_by: header
      header_name: Authorization
      policy: local

  - name: jwt
    route: identity-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: course-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: course-admin-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: course-protected-reads
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: cart-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: payment-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: media-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  # JWT cho route upload — đảm bảo chỉ user đã đăng nhập mới xin được presigned URL.
  - name: jwt
    route: media-upload
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp

  - name: jwt
    route: identity-admin-protected
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
