syntax = "proto3";

package securelearn;

service IdentityInternalService {
  rpc CheckInstructorProfile (InstructorProfileRequest) returns (InstructorProfileReply);
  rpc ListNotificationRecipients (NotificationRecipientRequest) returns (NotificationRecipientReply);
  rpc GetIdentitySnapshot (IdentitySnapshotRequest) returns (IdentitySnapshotReply);
}

message IdentitySnapshotRequest { string identityId = 1; string identityType = 2; }
message IdentitySnapshotReply { bool found = 1; string identityId = 2; string identityType = 3; string email = 4; string fullName = 5; string role = 6; bool active = 7; repeated string permissions = 8; }

message InstructorProfileRequest { string userId = 1; }
message InstructorProfileReply { bool complete = 1; repeated string missingFields = 2; }

message NotificationRecipientRequest { string audience = 1; string email = 2; string userId = 3; int32 page = 4; int32 limit = 5; string recipientType = 6; string permission = 7; }
message NotificationRecipient { string userId = 1; string email = 2; string fullName = 3; string role = 4; }
message NotificationRecipientReply { repeated NotificationRecipient recipients = 1; int32 total = 2; bool hasMore = 3; }

service MediaInternalService {
  rpc GetVideoAssetBinding (AssetByIdRequest) returns (MediaAssetBindingReply);
  rpc GetDocumentAssetBinding (AssetByIdRequest) returns (MediaAssetBindingReply);
}

service CourseInternalService {
  rpc ListCourseNotificationRecipients (CourseNotificationRecipientRequest) returns (CourseNotificationRecipientReply);
  rpc CheckCourseEntitlement (CourseEntitlementRequest) returns (CourseEntitlementReply);
  rpc GetCourseProgressContext (CourseProgressContextRequest) returns (CourseProgressContextReply);
  rpc GetReportTargetSnapshot (ReportTargetRequest) returns (ReportTargetReply);
}

service PaymentInternalService {
  rpc RecordSubscriptionUsage (SubscriptionUsageRequest) returns (SubscriptionUsageReply);
}

message AssetByIdRequest {
  string assetId = 1;
}

message MediaAssetBindingReply {
  string assetId = 1;
  string ownerUserId = 2;
  string courseId = 3;
  string lessonId = 4;
  string status = 5;
  bool isAttached = 6;
}

message ReportTargetRequest { string targetType = 1; string targetId = 2; string parentCourseId = 3; }
message ReportTargetReply { bool found = 1; string targetType = 2; string targetId = 3; string title = 4; string courseId = 5; string ownerUserId = 6; string actionUrl = 7; }

message CourseNotificationRecipientRequest { string courseId = 1; int32 page = 2; int32 limit = 3; }
message CourseNotificationRecipient { string userId = 1; string email = 2; string fullName = 3; string role = 4; }
message CourseNotificationRecipientReply { repeated CourseNotificationRecipient recipients = 1; int32 total = 2; bool hasMore = 3; }

message CourseEntitlementRequest {
  string userId = 1;
  string courseId = 2;
}

message CourseEntitlementReply {
  bool allowed = 1;
  string source = 2;
  string reason = 3;
  string termId = 4;
  string accessEndsAt = 5;
}

message CourseProgressContextRequest {
  string userId = 1;
  string userRole = 2;
  string courseId = 3;
}

message CourseProgressLesson {
  string lessonId = 1;
  string title = 2;
  string type = 3;
  int32 duration = 4;
  int32 order = 5;
  string sectionId = 6;
  int32 sectionOrder = 7;
  bool required = 8;
  repeated string equivalentLessonIds = 9;
}

message CourseProgressContextReply {
  bool allowed = 1;
  string reason = 2;
  string courseId = 3;
  string courseVersionId = 4;
  int32 totalLessons = 5;
  repeated CourseProgressLesson lessons = 6;
  string progressionMode = 7;
  string instructorId = 8;
}

message SubscriptionUsageRequest {
  string termId = 1;
  string userId = 2;
  string courseId = 3;
  string instructorId = 4;
  string lessonId = 5;
  string sessionId = 6;
  int32 segmentIndex = 7;
  int32 qualifiedSeconds = 8;
  string occurredAt = 9;
}

message SubscriptionUsageReply {
  string usageId = 1;
  bool duplicate = 2;
}
