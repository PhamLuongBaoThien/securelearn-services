syntax = "proto3";

package securelearn;

service IdentityInternalService {
  rpc CheckInstructorProfile (InstructorProfileRequest) returns (InstructorProfileReply);
}

message InstructorProfileRequest { string userId = 1; }
message InstructorProfileReply { bool complete = 1; repeated string missingFields = 2; }

service MediaInternalService {
  rpc GetVideoAssetBinding (AssetByIdRequest) returns (MediaAssetBindingReply);
  rpc GetDocumentAssetBinding (AssetByIdRequest) returns (MediaAssetBindingReply);
}

service CourseInternalService {
  rpc CheckCourseEntitlement (CourseEntitlementRequest) returns (CourseEntitlementReply);
  rpc GetCourseProgressContext (CourseProgressContextRequest) returns (CourseProgressContextReply);
}

service PaymentInternalService {
  rpc RecordSubscriptionUsage (SubscriptionUsageRequest) returns (SubscriptionUsageReply);
}

message AssetByIdRequest {
  string assetId = 1;
}

message MediaAssetBindingReply {
  string assetId = 1;
  string ownerUserId = 2;
  string courseId = 3;
  string lessonId = 4;
  string status = 5;
  bool isAttached = 6;
}

message CourseEntitlementRequest {
  string userId = 1;
  string courseId = 2;
}

message CourseEntitlementReply {
  bool allowed = 1;
  string source = 2;
  string reason = 3;
  string termId = 4;
  string accessEndsAt = 5;
}

message CourseProgressContextRequest {
  string userId = 1;
  string userRole = 2;
  string courseId = 3;
}

message CourseProgressLesson {
  string lessonId = 1;
  string title = 2;
  string type = 3;
  int32 duration = 4;
  int32 order = 5;
  string sectionId = 6;
  int32 sectionOrder = 7;
  bool required = 8;
  repeated string equivalentLessonIds = 9;
}

message CourseProgressContextReply {
  bool allowed = 1;
  string reason = 2;
  string courseId = 3;
  string courseVersionId = 4;
  int32 totalLessons = 5;
  repeated CourseProgressLesson lessons = 6;
  string progressionMode = 7;
  string instructorId = 8;
}

message SubscriptionUsageRequest {
  string termId = 1;
  string userId = 2;
  string courseId = 3;
  string instructorId = 4;
  string lessonId = 5;
  string sessionId = 6;
  int32 segmentIndex = 7;
  int32 qualifiedSeconds = 8;
  string occurredAt = 9;
}

message SubscriptionUsageReply {
  string usageId = 1;
  bool duplicate = 2;
}
